<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fafafa">
    <title>PDF Blender - Offline</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; background: #fafafa; color: #222125; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; }
      main { width: min(520px, 100%); text-align: center; }
      img { width: 72px; height: 72px; object-fit: contain; }
      h1 { margin: 24px 0 10px; font-size: 32px; }
      h1::after { content: ""; display: block; width: 40px; height: 3px; margin: 20px auto; background: #c9021e; }
      p { color: #636169; line-height: 1.7; margin: 8px 0; }
      .zh { margin-top: 22px; }
      button { margin-top: 24px; padding: 11px 18px; border: 0; border-radius: 8px; background: #222125; color: #fff; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 2px solid #c9021e; outline-offset: 4px; }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; background: #151416; color: #f2f0ee; }
        p { color: #aaa5af; }
        h1::after { background: #e74856; }
        button { background: #e74856; color: #151416; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="PDF Blender">
      <h1>You're offline</h1>
      <p>Reconnect to continue browsing PDF Blender.</p>
      <div class="zh" lang="zh-CN"><strong>当前处于离线状态</strong><p>恢复网络后即可继续浏览 PDF Blender。</p></div>
      <button type="button" onclick="location.reload()">Retry / 重试</button>
    </main>
  </body>
</html>
